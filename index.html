<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paradigma funcional en Python</title>
<style>
:root{
  --bg:#F4F7FD; --card:#FFFFFF; --ink:#13294B; --soft:#4A6084; --line:#D2E3F7; --light:#EAF1FC;
  --az:#2F6FED; --azo:#1B4FBF; --navy:#13294B; --verde:#1E9E6A; --rojo:#D64545; --ambar:#F2A93B;
  --code:#0E1F3A; --codefg:#E6EEFB; --shadow:0 6px 24px rgba(19,41,75,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1730; --card:#13264A; --ink:#E8EFFC; --soft:#9DB3D9; --line:#2A4272; --light:#1A3160;
    --az:#6B9BFF; --azo:#8FB4FF; --code:#07122A; --codefg:#E6EEFB; --verde:#3FCB92; --rojo:#FF7F7F; --shadow:0 6px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1730; --card:#13264A; --ink:#E8EFFC; --soft:#9DB3D9; --line:#2A4272; --light:#1A3160;
  --az:#6B9BFF; --azo:#8FB4FF; --code:#07122A; --codefg:#E6EEFB; --verde:#3FCB92; --rojo:#FF7F7F; --shadow:0 6px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Calibri,system-ui,-apple-system,sans-serif;font-size:18px;line-height:1.5}
h1,h2,h3{font-family:"Century Schoolbook",Georgia,"Times New Roman",serif;margin:0}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px}
.top .brand{font-family:Georgia,serif;font-weight:700;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{border:1px solid var(--line);background:var(--light);color:var(--ink);border-radius:10px;padding:6px 12px;font-size:14px;font-weight:600}
.ibtn:hover{border-color:var(--az)}
.ibtn.pri{background:var(--az);border-color:var(--az);color:#fff}
.bar{height:5px;background:var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--az);transition:width .3s}
main{max-width:1120px;margin:0 auto;padding:22px 16px 110px}
.slide{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px 32px;min-height:62vh;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tag{display:inline-block;background:var(--az);color:#fff;border-radius:99px;padding:3px 14px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.slide h2{font-size:clamp(24px,3.4vw,34px);margin-bottom:18px;line-height:1.2}
.hero{background:var(--navy);color:#fff;border:0;display:flex;flex-direction:column;justify-content:center;min-height:68vh}
.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.1;margin:14px 0}
.hero p{color:#B9CCEE;font-size:20px;margin:6px 0}
.hero .go{margin-top:22px;align-self:flex-start;background:var(--az);color:#fff;border:0;border-radius:12px;padding:12px 26px;font-weight:700;font-size:18px}
.blk{margin:14px 0}
ul.ul{margin:0;padding-left:24px}
ul.ul li{margin:8px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.crd{background:var(--light);border:2px solid var(--az);border-radius:14px;padding:14px 18px}
.crd h3{font-size:19px;margin-bottom:6px}
.crd ul{margin:0;padding-left:20px;font-size:16.5px}
.c-verde{border-color:var(--verde)} .c-verde h3{color:var(--verde)}
.c-rojo{border-color:var(--rojo)} .c-rojo h3{color:var(--rojo)}
.c-azul h3{color:var(--azo)}
.c-osc{border-color:var(--azo)} .c-osc h3{color:var(--azo)}
pre.code{margin:0;background:var(--code);color:var(--codefg);border-radius:12px;padding:16px 18px;overflow:auto;font:15px/1.5 "Cascadia Mono",Consolas,"Courier New",monospace;tab-size:4}
.k{color:#7FB2FF}.s{color:#9BE3B0}.cm{color:#8396B8;font-style:italic}.n{color:#F6C177}.b{color:#C9A7FF}
.lab{font-size:13px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.lab.verde{color:var(--verde)} .lab.rojo{color:var(--rojo)} .lab.azul{color:var(--azo)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.out{background:var(--light);border:1.5px solid var(--az);border-radius:12px;padding:10px 14px;font:15px/1.5 Consolas,"Courier New",monospace;white-space:pre-wrap;margin-top:10px}
.out b{font:700 12px "Segoe UI",sans-serif;color:var(--azo);display:block;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.hide{display:none}
.rev{margin-top:10px}
.note{border-left:5px solid var(--az);background:var(--light);padding:10px 16px;border-radius:0 10px 10px 0;font-size:18px}
.note.verde{border-color:var(--verde)} .note.rojo{border-color:var(--rojo)}
table.t{width:100%;border-collapse:collapse;font-size:16.5px;border-radius:10px;overflow:hidden}
table.t th{background:var(--az);color:#fff;text-align:left;padding:9px 12px}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line)}
table.t tr:nth-child(even) td{background:var(--light)}
table.t.rojo th{background:var(--rojo)} table.t.verde th{background:var(--verde)}
.img{width:100%;max-width:900px;display:block;margin:0 auto;border-radius:12px;background:#fff;border:1px solid var(--line)}
.flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px}
.flow .box{background:var(--light);border:2.5px solid var(--az);border-radius:16px;padding:14px 20px;text-align:center;min-width:150px}
.flow .box.m{border-color:var(--verde)}
.flow .box .e{font-size:44px;line-height:1.2}
.flow .ar{font-size:30px;font-weight:700}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:14px;margin:10px 0;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;background:var(--az);color:#fff;font-weight:700;display:grid;place-items:center}
.cl{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin:12px 0;background:var(--card)}
.cl .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cl .btns button{border:2px solid var(--line);background:var(--light);color:var(--ink);border-radius:10px;padding:6px 16px;font-weight:600}
.cl .btns button:hover:not(:disabled){border-color:var(--az)}
.cl .btns button.ok{background:var(--verde);border-color:var(--verde);color:#fff}
.cl .btns button.no{background:var(--rojo);border-color:var(--rojo);color:#fff}
.cl .why{margin-top:8px;font-size:16px}
.score{font-weight:700;color:var(--azo);margin-top:6px}
.bnav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 14px;z-index:20}
.bnav .cnt{min-width:90px;text-align:center;font-weight:700;color:var(--soft)}
.bnav button{min-width:120px}
button:disabled{opacity:.45;cursor:not-allowed}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(340px,88vw);background:var(--card);border-right:1px solid var(--line);z-index:30;transform:translateX(-105%);transition:transform .25s;overflow:auto;padding:14px 0;box-shadow:var(--shadow)}
.drawer.open{transform:none}
.drawer h3{padding:6px 18px;font-size:14px;color:var(--soft);text-transform:uppercase;letter-spacing:.1em}
.drawer a{display:block;padding:7px 18px;color:var(--ink);text-decoration:none;font-size:16px;cursor:pointer}
.drawer a:hover,.drawer a.cur{background:var(--light);color:var(--azo);font-weight:700}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25;display:none}
.veil.open{display:block}
/* quiz */
.qh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--soft);font-weight:600}
.qq{font-size:21px;margin:12px 0 6px;font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:9px 0;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 16px;font-size:17px}
.opt:hover:not(:disabled){border-color:var(--az);background:var(--light)}
.opt.ok{border-color:var(--verde);background:rgba(30,158,106,.14)}
.opt.no{border-color:var(--rojo);background:rgba(214,69,69,.13)}
.opt code,.qq code{font-family:Consolas,"Courier New",monospace;background:var(--light);padding:1px 6px;border-radius:5px;font-size:.92em}
.fb{margin-top:12px;padding:12px 16px;border-radius:12px;background:var(--light);border-left:5px solid var(--az)}
.fb.ok{border-color:var(--verde)} .fb.no{border-color:var(--rojo)}
.big{font-size:56px;font-family:Georgia,serif;font-weight:700;color:var(--azo)}
.rv{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
.rv.ok{border-left:6px solid var(--verde)} .rv.no{border-left:6px solid var(--rojo)}
.pg{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 4px}
.pg i{display:block;height:100%;background:var(--verde)}
@media (max-width:640px){.lg{display:none}.top{gap:6px;padding:8px 10px}.top .brand{display:none}.top #bQuiz{margin-left:auto}.slide{padding:20px 16px}.bnav button{min-width:96px}.top .brand{font-size:14px}}
@media print{.top,.bnav,.drawer,.veil{display:none}.slide{box-shadow:none;break-after:page}}
</style>
</head>
<body>
<div class="top">
  <button class="ibtn" id="bIdx" aria-label="Índice">☰<span class="lg"> Índice</span></button>
  <div class="brand">Paradigma funcional en Python</div>
  <button class="ibtn" id="bQuiz">📝<span class="lg"> Cuestionario</span></button>
  <button class="ibtn" id="bTheme" aria-label="Cambiar tema">🌓</button>
</div>
<div class="bar"><i id="prog"></i></div>
<div class="veil" id="veil"></div>
<nav class="drawer" id="drawer" aria-label="Índice"></nav>
<main id="stage"></main>
<div class="bnav">
  <button class="ibtn" id="bPrev">← Anterior</button>
  <div class="cnt" id="cnt"></div>
  <button class="ibtn pri" id="bNext">Siguiente →</button>
</div>

/* ---------- utilidades ---------- */
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function hl(src){
  const re=/(#.*$)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(def|return|for|in|if|else|import|from|class|try|except|as|lambda|global|while|True|False|None|not)\b|\b(\d+(?:\.\d+)?)\b|\b(print|sum|sorted|map|filter|reduce|list|len|round|tuple|enumerate|dataclass|replace|lru_cache)\b(?=\()/gm;
  let out='',last=0,m;
  while((m=re.exec(src))){
    out+=esc(src.slice(last,m.index));
    const t=esc(m[0]);
    out+= m[1]?`<span class="cm">${t}</span>`: m[2]?`<span class="s">${t}</span>`: m[3]?`<span class="k">${t}</span>`: m[4]?`<span class="n">${t}</span>`:`<span class="b">${t}</span>`;
    last=m.index+m[0].length;
  }
  return out+esc(src.slice(last));
}
const code=(c)=>`<pre class="code">${hl(c)}</pre>`;
let uid=0;
function codeOut(c,o,lab){
  const id='r'+(uid++);
  return `<div class="blk">${lab?`<div class="lab">${lab}</div>`:''}${code(c)}${o?`<div class="rev"><button class="ibtn" data-rev="${id}">▶ Ver salida</button></div><div class="out hide" id="${id}"><b>Salida</b>${esc(o)}</div>`:''}</div>`;
}

const Q=[
 {q:"¿Cuáles son las dos condiciones de una <b>función pura</b>?",o:["Devuelve un valor y tiene nombre","Mismo resultado con los mismos argumentos y sin efectos secundarios","Usa recursión y no usa variables","Recibe otra función y la ejecuta"],a:1,e:"Una función pura es determinista (misma entrada → misma salida) y no produce efectos secundarios."},
 {q:"¿Cuál de estas acciones es un <b>efecto secundario</b>?",o:["Devolver un número con <code>return</code>","Usar un parámetro dentro de la función","Imprimir con <code>print()</code>","Crear una variable local"],a:2,e:"Imprimir afecta al exterior (la pantalla). Devolver valores y usar variables locales no lo hace."},
 {q:"¿Es pura esta función? <code>def f(x): return x * 2</code>",o:["Sí, solo usa su parámetro y devuelve un valor","No, porque multiplica","No, porque no imprime","Depende de cuántas veces se llame"],a:0,e:"No usa nada externo ni modifica nada: es pura."},
 {q:"¿Qué diferencia hay entre <code>lista.sort()</code> y <code>sorted(lista)</code>?",o:["Ninguna","<code>sort()</code> crea una lista nueva y <code>sorted</code> modifica la original","<code>sort()</code> modifica la original y <code>sorted</code> devuelve una nueva","Solo <code>sorted</code> funciona con números"],a:2,e:"<code>sort()</code> muta la lista (impura). <code>sorted()</code> devuelve una copia ordenada (pura)."},

function renderBlock(b){
  switch(b.k){
    case 'ul': return `<div class="blk"><ul class="ul">${b.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
    case 'steps': return `<div class="blk"><ol class="steps">${b.items.map(i=>`<li><div>${i}</div></li>`).join('')}</ol></div>`;
    case 'cards': return `<div class="blk cards">${b.items.map(c=>`<div class="crd c-${c.c||'azul'}"><h3>${c.h}</h3><ul>${c.b.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>`;
    case 'code': return codeOut(b.code,b.out,b.lab);
    case 'two': return `<div class="blk grid2"><div><div class="lab ${b.l.c}">${b.l.lab}</div>${code(b.l.code)}</div><div><div class="lab ${b.r.c}">${b.r.lab}</div>${code(b.r.code)}</div></div>`;
    case 'img': return `<div class="blk"><img class="img" src="${IMG[b.src]}" alt="${b.alt}"></div>`;
    case 'table': return `<div class="blk"><table class="t ${b.cls||''}"><tr>${b.head.map(h=>`<th>${h}</th>`).join('')}</tr>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
    case 'note': return `<div class="blk note ${b.c||''}">${b.text}</div>`;
    case 'flow': return `<div class="blk flow">${b.items.map((it,i)=>`${i?'<div class="ar">→</div>':''}<div class="box ${it.m?'m':''}"><div class="e">${it.e}</div><b>${it.l}</b></div>`).join('')}</div>`;
    case 'classify': {
      const id='c'+(uid++);
      return `<div class="blk" data-cl="${id}">${b.items.map((it,i)=>`<div class="cl" data-i="${i}" data-ans="${it.ans}">${code(it.code)}<div class="btns">${b.opts.map((o,j)=>`<button data-j="${j}">${o}</button>`).join('')}</div><div class="why hide">${it.why}</div></div>`).join('')}<div class="score" data-n="${b.items.length}">Aciertos: 0 / ${b.items.length}</div></div>`;
    }
    case 'solution': { const id='r'+(uid++);
      return `<div class="blk"><button class="ibtn pri" data-rev="${id}">${b.label}</button><div class="hide" id="${id}" style="margin-top:12px">${codeOut(b.code,b.out,"Solución")}</div></div>`; }
  }
  return '';
}
function renderSlide(i){
  const s=S[i];
  if(s.hero) return `<section class="slide hero"><span class="tag">${s.tag}</span><h1>${s.t}</h1>${s.sub.map(x=>`<p>${x}</p>`).join('')}<button class="go" id="goBtn">Comenzar →</button></section>`;
  if(s.quiz) return `<section class="slide"><span class="tag">${s.tag}</span><h2>${s.t}</h2><div id="quiz"></div></section>`;
  return `<section class="slide"><span class="tag">${s.tag}</span><h2>${s.t}</h2>${s.blocks.map(renderBlock).join('')}</section>`;
}
function go(i,noScroll){
  cur=Math.max(0,Math.min(S.length-1,i));
  stage.innerHTML=renderSlide(cur);
  document.getElementById('prog').style.width=((cur+1)/S.length*100)+'%';
  document.getElementById('cnt').textContent=(cur+1)+' / '+S.length;
  document.getElementById('bPrev').disabled=cur===0;
  document.getElementById('bNext').disabled=cur===S.length-1;
  document.querySelectorAll('#drawer a').forEach((a,k)=>a.classList.toggle('cur',k===cur));
  try{history.replaceState(null,'','#'+(cur+1));}catch(e){}
  if(S[cur].quiz) startQuiz();
  if(!noScroll) window.scrollTo({top:0});
  const g=document.getElementById('goBtn'); if(g) g.onclick=()=>go(1);
}
/* delegación de clics */
stage.addEventListener('click',e=>{
  const r=e.target.closest('[data-rev]');
  if(r){const el=document.getElementById(r.dataset.rev);const h=el.classList.toggle('hide');
    if(r.textContent.includes('salida')||r.textContent.includes('Ver')) r.textContent=h?'▶ Ver salida':'▼ Ocultar salida';
    else if(r.textContent.includes('solución')) r.textContent=h?'Mostrar solución':'Ocultar solución';
    return;}
  const b=e.target.closest('.cl .btns button');
  if(b){const cl=b.closest('.cl');if(cl.dataset.done)return;cl.dataset.done=1;
    const ok=+b.dataset.j===+cl.dataset.ans;
    b.classList.add(ok?'ok':'no');
    if(!ok)cl.querySelector(`button[data-j="${cl.dataset.ans}"]`).classList.add('ok');
    cl.querySelectorAll('button').forEach(x=>x.disabled=true);
    cl.querySelector('.why').classList.remove('hide');
    cl.querySelector('.why').innerHTML=(ok?'✅ ¡Correcto! ':'❌ Era otra. ')+cl.querySelector('.why').innerHTML;
    const root=cl.closest('[data-cl]');const sc=root.querySelector('.score');
    const n=root.querySelectorAll('.cl button.ok').length - root.querySelectorAll('.cl button.no').length*0;
    const good=[...root.querySelectorAll('.cl')].filter(c=>c.dataset.done&&c.querySelector('button.no')===null).length;
    sc.textContent='Aciertos: '+good+' / '+sc.dataset.n;
  }
});

/* ---------- cuestionario ---------- */
let qs,qi,qscore,qlog;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQuiz(){
  qs=Q.map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return {q:q.q,e:q.e,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)};});
  qi=0;qscore=0;qlog=[];showQ();
}
function showQ(){
  const box=document.getElementById('quiz');
  if(qi>=qs.length){
    const p=Math.round(qscore/qs.length*100);
    const msg=p>=90?"¡Excelente! Dominas el tema.":p>=70?"Muy bien. Repasa los puntos que fallaste.":p>=50?"Vas bien, pero conviene repasar las diapositivas.":"Te sugiero volver a revisar la clase y repetir el cuestionario.";
    box.innerHTML=`<div style="text-align:center"><div class="big">${qscore} / ${qs.length}</div><div class="pg"><i style="width:${p}%"></i></div><p><b>${p} %</b> · ${msg}</p><button class="ibtn pri" id="again">↻ Repetir cuestionario</button> <button class="ibtn" id="back">Volver a la clase</button></div><h3 style="margin:20px 0 6px">Revisión</h3>${qlog.map((l,i)=>`<div class="rv ${l.ok?'ok':'no'}"><b>${i+1}.</b> ${l.q}<br><small>${l.ok?'✅ Acertaste':'❌ Tu respuesta: '+l.mine}</small><br><small><b>Correcta:</b> ${l.right}</small><br><small>${l.e}</small></div>`).join('')}`;
    document.getElementById('again').onclick=startQuiz;
    document.getElementById('back').onclick=()=>go(0);
    return;
  }
  const q=qs[qi];
  box.innerHTML=`<div class="qh"><span>Pregunta ${qi+1} de ${qs.length}</span><span>Puntos: ${qscore}</span></div><div class="pg"><i style="width:${qi/qs.length*100}%"></i></div><div class="qq">${q.q}</div><div id="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><b>${'ABCD'[i]}.</b> ${o}</button>`).join('')}</div><div id="fb"></div>`;
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}
function answer(i){
  const q=qs[qi];const ok=i===q.a;if(ok)qscore++;
  qlog.push({q:q.q,ok,mine:q.o[i],right:q.o[q.a],e:q.e});
  document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('ok');else if(k===i)b.classList.add('no');});
  const fb=document.getElementById('fb');
  fb.innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'¡Correcto!':'No exactamente.'}</b> ${q.e}</div><p style="text-align:right"><button class="ibtn pri" id="nx">${qi===qs.length-1?'Ver resultado':'Siguiente pregunta →'}</button></p>`;
  document.getElementById('nx').onclick=()=>{qi++;showQ();};
}
